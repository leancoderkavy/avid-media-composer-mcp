name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag
        required: true
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r python/requirements.txt
      - run: npm run check
      - name: Refuse duplicate version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "avid-media-composer-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "avid-media-composer-mcp@${VERSION} is already published."
            exit 1
          fi
      - name: Publish with provenance
        env:
          NPM_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$NPM_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
            echo "Invalid npm distribution tag."
            exit 1
          fi
          npm publish --access public --provenance --tag "$NPM_TAG"
